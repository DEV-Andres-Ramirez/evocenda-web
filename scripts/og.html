<!doctype html><html lang="es"><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#090612;color:#F4F2F9;font-family:Geist,system-ui;overflow:hidden;position:relative}
.lat{position:absolute;inset:0;background-image:radial-gradient(rgba(244,236,255,.11) 1px,transparent 1.3px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse 75% 80% at 60% 40%,#000 20%,transparent 78%)}
.glow{position:absolute;border-radius:50%;filter:blur(40px)}
.g1{left:-160px;top:-180px;width:620px;height:620px;background:radial-gradient(closest-side,rgba(183,103,255,.34),transparent)}
.g2{right:-120px;bottom:-220px;width:680px;height:680px;background:radial-gradient(closest-side,rgba(183,103,255,.26),transparent)}
.net{position:absolute;right:-20px;top:0;width:640px;height:630px}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.lock{display:flex;align-items:center;gap:16px}
.wm{font:600 34px Sora;letter-spacing:-.03em;line-height:1}
.by{font:500 13px 'Geist Mono';letter-spacing:.26em;text-transform:uppercase;color:#B4ACC5;margin-top:8px}
h1{font:600 92px/0.98 Sora;letter-spacing:-.04em;max-width:760px}
.grad{background:linear-gradient(100deg,#D297FF 5%,#B767FF 48%,#54EAEA);-webkit-background-clip:text;color:transparent}
.dot{color:#B767FF}
.sub{margin-top:26px;font-size:25px;line-height:1.4;color:#B4ACC5;max-width:660px}
.foot{display:flex;gap:14px;align-items:center;font:500 15px 'Geist Mono';letter-spacing:.16em;text-transform:uppercase;color:#B4ACC5}
.foot i{width:6px;height:6px;border-radius:50%;background:#B767FF;box-shadow:0 0 12px 3px rgba(183,103,255,.6)}
</style>
<div class="lat"></div><div class="glow g1"></div><div class="glow g2"></div>
<svg class="net" viewBox="0 0 640 630" fill="none">
  <g stroke="#B767FF" stroke-opacity=".28" stroke-width="1.2">
    <path d="M250 110 380 70 520 140 600 80M380 70 420 210 520 140 590 260 470 320 420 210 300 250 250 110M300 250 340 400 470 320 560 430 590 260M340 400 440 520 560 430 610 540 440 520 300 560 340 400M300 250 200 330 340 400M200 330 300 560"/>
  </g>
  <path d="M200 330 300 250 420 210 470 320 560 430 610 540" stroke="#54EAEA" stroke-opacity=".85" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F4ECFF"><circle cx="250" cy="110" r="3"/><circle cx="380" cy="70" r="4"/><circle cx="520" cy="140" r="3"/><circle cx="600" cy="80" r="2.500"/><circle cx="590" cy="260" r="3.500"/><circle cx="340" cy="400" r="4"/><circle cx="440" cy="520" r="3"/><circle cx="300" cy="560" r="2.500"/></g>
  <g fill="#090612" stroke="#54EAEA" stroke-width="2"><circle cx="200" cy="330" r="6"/><circle cx="300" cy="250" r="6"/><circle cx="420" cy="210" r="6"/><circle cx="470" cy="320" r="6"/><circle cx="560" cy="430" r="6"/></g>
  <circle cx="610" cy="540" r="9" fill="#54EAEA"/><circle cx="610" cy="540" r="18" stroke="#54EAEA" stroke-opacity=".4" stroke-width="1.500"/>
</svg>
<div class="wrap">
  <div class="lock">
    <svg viewBox="0 0 64 64" width="62" height="62"><defs><linearGradient id="g" x1="8" y1="56" x2="56" y2="8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8e3df2"/><stop offset=".55" stop-color="#c792ff"/><stop offset="1" stop-color="#54eaea"/></linearGradient></defs>
    <g fill="none" stroke="url(#g)" stroke-width="4.800" stroke-linecap="round" stroke-linejoin="round"><path d="M11 54 31 11V54"/><path d="M18.900 37H31"/><path d="M31 11H41.5a10.5 10.5 0 0 1 0 21H31"/><path d="M40 32 53 54"/></g>
    <g stroke="url(#g)" stroke-width="2.400" fill="#090612"><circle cx="11" cy="54" r="4"/><circle cx="31" cy="11" r="4"/></g><circle cx="53" cy="54" r="5" fill="#54eaea"/></svg>
    <div><div class="wm">evocenda</div><div class="by">by Andrés</div></div>
  </div>
  <div>
    <h1>Mi evolución,<br>hecha <span class="grad">senda</span><span class="dot">.</span></h1>
    <p class="sub">Andrés Ramírez · Desarrollador Full-Stack Senior y formador en inteligencia artificial.</p>
  </div>
  <div class="foot"><i></i>IA aplicada<i></i>Automatización<i></i>Transformación digital</div>
</div>
